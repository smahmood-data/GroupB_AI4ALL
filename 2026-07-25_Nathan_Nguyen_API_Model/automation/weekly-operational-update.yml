name: Weekly Puerto Rico outbreak update

on:
  schedule:
    # Wednesday morning in Puerto Rico.  Midweek timing gives the official
    # source time to publish revisions after the prior epidemiological week.
    - cron: "17 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puerto-rico-operational-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Ingest, predict, and monitor
        run: python src/continuous_pipeline.py weekly

      - name: Refresh the API model explainer
        run: python src/generate_api_model_explainer.py

      - name: Refresh the public dashboard snapshot
        run: python src/generate_public_dashboard.py

      - name: Commit auditable operational outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operational models/operational reports/operational docs/app/data/dashboard.json docs/app/data/dashboard-data.js docs/puerto-rico-api-model-explainer.html docs/puerto-rico-api-model-focused.html
          if git diff --cached --quiet; then
            echo "No operational changes to commit."
            exit 0
          fi
          git commit -m "data: refresh Puerto Rico outbreak outputs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
