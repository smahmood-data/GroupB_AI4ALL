name: Puerto Rico dengue model update

on:
  schedule:
    # Refresh official cases, weather, forecasts, monitoring, and public pages
    # each Wednesday morning in Puerto Rico. Midweek timing gives the health
    # source time to publish revisions from the prior epidemiological week.
    - cron: "17 14 * * 3"
    # Check on the first day of each month whether enough finalized case weeks
    # exist to train and evaluate a new candidate model.
    - cron: "17 15 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a data/forecast update or a guarded retraining check"
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly

# Prevent the update and retraining jobs from pushing at the same time.
concurrency:
  group: puerto-rico-dengue-model-writes
  cancel-in-progress: false

env:
  PROJECT_DIR: 2026-07-25_Nathan_Nguyen_API_Model

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize before validation
        shell: bash
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements-automation.lock

      - name: Install model dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m pip install --requirement requirements-automation.lock

      - name: Test the committed model before using live APIs
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Choose update or retraining mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "17 15 1 * *" ]]; then
            mode="monthly"
          else
            mode="weekly"
          fi
          echo "value=${mode}" >> "$GITHUB_OUTPUT"
          echo "Running ${mode} mode."

      - name: Update data, score forecasts, and monitor prior predictions
        working-directory: ${{ env.PROJECT_DIR }}
        run: python src/continuous_pipeline.py "${{ steps.mode.outputs.value }}"

      - name: Rebuild the public dashboard snapshot
        working-directory: ${{ env.PROJECT_DIR }}
        run: python src/generate_public_dashboard.py

      - name: Rebuild both model explainers
        working-directory: ${{ env.PROJECT_DIR }}
        run: python src/generate_api_model_explainer.py

      - name: Test the complete generated result
        working-directory: ${{ env.PROJECT_DIR }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit complete, verified outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "$PROJECT_DIR/data/operational" \
            "$PROJECT_DIR/models/operational" \
            "$PROJECT_DIR/reports/operational" \
            "$PROJECT_DIR/docs/app/data/dashboard.json" \
            "$PROJECT_DIR/docs/app/data/dashboard-data.js" \
            "$PROJECT_DIR/docs/puerto-rico-api-model-explainer.html" \
            "$PROJECT_DIR/docs/puerto-rico-api-model-focused.html"

          unexpected="$(git diff --cached --name-only | awk -v prefix="$PROJECT_DIR/" 'index($0, prefix) != 1')"
          if [[ -n "$unexpected" ]]; then
            echo "Refusing to commit files outside $PROJECT_DIR:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "The APIs and generated pages produced no repository changes."
          else
            git commit -m "data: refresh Puerto Rico dengue model (${{ steps.mode.outputs.value }})"
          fi

          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
